<div class="mod-pedal mod-pedal-boxy mod-cyber-feedbacker">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <!-- Top Branding -->
    <div class="pedal-top-strip">
        <div class="mod-pedal-brand">CYBER AUDIO</div>
        <div class="mod-pedal-model">ACOUSTIC FEEDBACK &amp; SUSTAINER</div>
    </div>

    <!-- Pedal Name -->
    <div class="mod-pedal-name">FEEDBACKER</div>

    <!-- Mode Selector Pills -->
    <div class="mode-selector-bar">
        <button type="button" class="mode-pill active" data-mode="0">ROOT</button>
        <button type="button" class="mode-pill" data-mode="1">POLY</button>
        <button type="button" class="mode-pill" data-mode="2">BLOOM</button>
        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="mode" style="display:none;"></div>
    </div>

    <!-- Knobs Container -->
    <div class="cyber-knobs-grid">
        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="bloom" data-min="0" data-max="100" data-default="40">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">BLOOM</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="bloom" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="sens" data-min="0" data-max="100" data-default="60">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">SENS</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="sens" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="coupling" data-min="0" data-max="100" data-default="70">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">COUPLING</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="coupling" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="harmonic" data-min="0" data-max="3" data-default="1">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">HARMONIC</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="harmonic" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="warmth" data-min="0" data-max="100" data-default="50">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">WARMTH</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="warmth" style="display:none;"></div>
        </div>

        <div class="knob-cell">
            <div class="custom-knob-dial" data-symbol="vibrato" data-min="0" data-max="100" data-default="75">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">VIBRATO</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="vibrato" style="display:none;"></div>
        </div>

        <div class="knob-cell" style="grid-column: span 2;">
            <div class="custom-knob-dial" data-symbol="mix" data-min="0" data-max="100" data-default="55">
                <div class="knob-rotor"></div>
            </div>
            <span class="mod-knob-title">MIX</span>
            <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="mix" style="display:none;"></div>
        </div>
    </div>

    <!-- Footswitch Section -->
    <div class="pedal-bottom-section">
        <div class="footswitch-wrapper">
            <div class="mod-led" mod-role="bypass-light"></div>
            <div class="mod-footswitch" mod-role="bypass"></div>
        </div>
    </div>
</div>
